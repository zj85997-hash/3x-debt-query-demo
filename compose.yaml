x-api: &api
  build: .
  restart: unless-stopped
  init: true
  environment: &api-env
    DB_HOST: mysql
    DB_PORT: 3306
    DB_USER: demo_app
    DB_PASSWORD: ${DEMO_DB_PASSWORD:?set DEMO_DB_PASSWORD}
    DEMO_MODE: "1"
    DEMO_SIGNING_KEY: ${DEMO_SIGNING_KEY:?set DEMO_SIGNING_KEY}
  depends_on:
    mysql:
      condition: service_healthy
  healthcheck:
    test: ["CMD","node","-e","fetch('http://127.0.0.1:8931/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
    interval: 10s
    timeout: 4s
    retries: 3
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DEMO_DB_ROOT_PASSWORD:?set DEMO_DB_ROOT_PASSWORD}
      MYSQL_DATABASE: debt_demo
      MYSQL_USER: demo_app
      MYSQL_PASSWORD: ${DEMO_DB_PASSWORD:?set DEMO_DB_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./deploy/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL","mysql -u demo_app -p\"$$MYSQL_PASSWORD\" debt_demo -e 'SELECT 1 FROM authorized_assets LIMIT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 4s
      retries: 20
  api-a:
    <<: *api
    environment:
      <<: *api-env
      INSTANCE_NAME: api-a
  api-b:
    <<: *api
    environment:
      <<: *api-env
      INSTANCE_NAME: api-b
  ingress:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8930:8080"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api-a:
        condition: service_healthy
      api-b:
        condition: service_healthy
volumes:
  mysql-data:
