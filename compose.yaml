# 单机一体化编排（演示 / 联调用）：MySQL + Redis + 第三方模拟器 + 应用。
# 生产环境不使用本文件里的 mysql / redis / provider-sim，而是接入云数据库、云 Redis 与真实供应商（见开发文档第 11 章）。
# 注意：编写环境没有 Docker，本文件未经实际运行验证。
# 使用前在同目录创建 .env（参考 deploy/env.example），至少填好四个密钥与数据库密码。
x-app-env: &app-env
  APP_MODE: demo
  DB_HOST: mysql
  DB_PORT: 3306
  DB_USER: dq_app
  DB_PASSWORD: ${DB_PASSWORD:?请在 .env 中设置 DB_PASSWORD}
  DB_NAME: debt_query
  REDIS_URL: redis://redis:6379/0
  TOKEN_SECRET: ${TOKEN_SECRET:?请在 .env 中设置 TOKEN_SECRET}
  ID_HASH_KEY: ${ID_HASH_KEY:?请在 .env 中设置 ID_HASH_KEY}
  PAY_NOTIFY_SECRET: ${PAY_NOTIFY_SECRET:?请在 .env 中设置 PAY_NOTIFY_SECRET}
  OPS_TOKEN: ${OPS_TOKEN:?请在 .env 中设置 OPS_TOKEN}
  VERIFY_PROVIDER_URL: http://provider-sim:8810
  PAY_PROVIDER_URL: http://provider-sim:8810
  PAY_NOTIFY_URL: http://app:8800/api/v1/pay/notify

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command: ["--innodb-buffer-pool-size=1G", "--innodb-redo-log-capacity=1G", "--max-connections=300"]
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?请在 .env 中设置 DB_ROOT_PASSWORD}
      MYSQL_DATABASE: debt_query
      MYSQL_USER: dq_app
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes: ["mysql-data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u dq_app -p\"$$MYSQL_PASSWORD\" --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--save", ""]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  provider-sim:
    build: .
    restart: unless-stopped
    command: ["node", "mocks/provider-sim.mjs"]
    environment:
      PROVIDER_PORT: "8810"
      PAY_NOTIFY_SECRET: ${PAY_NOTIFY_SECRET}
  migrate:
    build: .
    command: ["sh", "-c", "node scripts/migrate.mjs && node scripts/seed.mjs"]
    environment: *app-env
    depends_on:
      mysql: {condition: service_healthy}
  app:
    build: .
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    environment:
      <<: *app-env
      API_WORKERS: "4"
      NODE_NAME: node1
      DRAIN_GRACE_MS: "5000"
    ports: ["127.0.0.1:8800:8800"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      provider-sim: {condition: service_started}
volumes:
  mysql-data:
  redis-data:
